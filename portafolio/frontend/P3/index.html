<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSLA Prediction App | Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./P3-predictionStyle.css">
</head>
<body>

<nav>
    <div class="container nav-inner">
        <a href="../index.html" class="logo">MyPortafolio</a>

        <div class="links">
            <a href="../index.html#projects">Projects</a>
            <a href="../template/index.html?projectId=P3">Back to Project</a>
        </div>
    </div>
</nav>

<main>
    <section class="prediction container" id="prediction-app">
        <div class="section-title">Prediction</div>
        <div class="band-spectrum-rule section-rule" aria-hidden="true"></div>

        <div class="prediction-layout">
            <div class="prediction-meta">
                <span class="meta-kicker">Model inference</span>
                <h1>TSLA Market Prediction</h1>
            </div>

            <div class="prediction-content">
                <div class="predict-box">
                    <label for="startDate">Start date</label>
                    <input id="startDate" type="date">

                    <label for="modelSelect">Model</label>
                    <select id="modelSelect">
                        <option>Loading models...</option>
                    </select>

                    <button type="button" onclick="predictMovement()">
                        Predict Movement
                    </button>
                </div>

                <div id="resultBox" class="result" aria-live="polite">
                    <h2>Prediction result</h2>
                    <p>Select a date and model, then run the prediction.</p>
                </div>
            </div>
        </div>
    </section>
</main>

<footer>
    © 2026 Portfolio · TSLA Market Prediction
</footer>

<script src="./P3-predictionScript.js"></script>
</body>
</html>
