[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "PT3_tesla"
version = "0.1.0"
authors = [{name = "autor1", email = "correo@correo.com"}]
description = "TSLA Financial Direction Prediction Using Neural Networks"
requires-python = ">3.9"
dependencies = [
    "matplotlib==3.10.0",
    "numpy==2.0.2",
    "pandas==2.2.2",
    "yfinance==0.2.66",
    "dvc[gdrive]==3.67.1"
]

[tool.setuptools.packages.find]
where = ["P3_tsla/src"]